# .github/workflows/android.yml
# BlockStar Cypher — Android build (Capacitor)
#
# FIX for "Failed to find package 'tools'": the obsolete `tools` SDK package was
# removed by Google. This job never requests it — it uses setup-android@v3 (current)
# with NO `packages:` input, plus the runner's preinstalled SDK. If your existing
# workflow passes `tools` to sdkmanager or a `with: packages:` list, delete that token.

name: Android Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # Capacitor + AGP 8 need JDK 17

      # Current v3 — does NOT install the removed `tools` package.
      # Do not add `with: packages: ... tools ...` here.
      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      # Same peer-dep flag as your other jobs (wagmi/accounts conflict).
      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Build web
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cypher-android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk

      # For a release build instead, replace the two steps above with:
      #   run: ./gradlew bundleRelease   (needs signing config / keystore secrets)
