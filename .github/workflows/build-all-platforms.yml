name: Build All Platforms

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows'
        required: false
        default: true
        type: boolean
      build_macos:
        description: 'Build macOS'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '20'

# ═══════════════════════════════════════════════════════════════
# IMPORTANT
# This workflow builds from the Electron files IN THE REPO
# (frontend/electron/main.js + preload.js) and the config in
# frontend/electron-builder.json.
#
# The previous version overwrote electron/main.js with a bare-bones copy that had
# NO preload script, and replaced the electron-builder config. That is why the
# Windows app never had window.electronAPI (desktop wallet bridge) no matter what
# was in the repo. Do not re-add a step that writes electron/main.js.
# ═══════════════════════════════════════════════════════════════

jobs:
  # ═══════════════════════════════════════════════════════════════
  # BUILD FRONTEND (shared by all platforms)
  # ═══════════════════════════════════════════════════════════════
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build frontend for Electron
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        working-directory: frontend
        run: |
          test -f out/index.html || { echo "❌ out/index.html missing"; exit 1; }
          echo "✅ out/index.html present"
          find out -name "*.js" | head -5

      - name: Upload frontend build
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build
          path: frontend/out
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════
  # WINDOWS BUILD (Electron) — single NSIS installer
  # ═══════════════════════════════════════════════════════════════
  build-windows:
    needs: build-frontend
    runs-on: windows-latest
    if: ${{ github.event.inputs.build_windows != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download frontend build
        uses: actions/download-artifact@v6
        with:
          name: frontend-build
          path: frontend/out

      - name: Install dependencies
        working-directory: frontend
        shell: bash
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      # Fails the build if the repo's Electron files are missing or were replaced,
      # instead of silently shipping an app without the desktop wallet bridge.
      - name: Verify Electron files (preload bridge)
        working-directory: frontend
        shell: bash
        run: |
          test -f electron/main.js    || { echo "❌ electron/main.js missing"; exit 1; }
          test -f electron/preload.js || { echo "❌ electron/preload.js missing"; exit 1; }
          grep -q "preload" electron/main.js || { echo "❌ main.js does not load a preload script"; exit 1; }
          grep -q "exposeInMainWorld('electronAPI'" electron/preload.js || { echo "❌ preload.js does not expose electronAPI"; exit 1; }
          echo "✅ Using repo main.js + preload.js"
          grep -o "MAIN_BUILD_TAG = '[^']*'" electron/main.js || true

      - name: Prepare icons (only generates what's missing)
        working-directory: frontend
        shell: bash
        run: |
          npm install --no-save --legacy-peer-deps sharp png-to-ico@2
          cat > prepare-icons.js << 'EOF'
          const sharp = require('sharp');
          const pngToIco = require('png-to-ico');
          const fs = require('fs');
          (async () => {
            fs.mkdirSync('public', { recursive: true });
            const png = 'public/icon.png';
            if (!fs.existsSync(png)) {
              console.log('No public/icon.png — creating placeholder');
              const svg = Buffer.from('<svg width="512" height="512"><rect width="512" height="512" fill="#3B82F6" rx="100"/><text x="256" y="300" text-anchor="middle" font-size="200" fill="white" font-family="Arial">BC</text></svg>');
              await sharp(svg).png().toFile(png);
            }
            if (!fs.existsSync('public/icon.ico')) {
              console.log('Generating public/icon.ico from icon.png');
              await sharp(png).resize(256, 256, { fit: 'contain', background: { r: 0, g: 0, b: 0, alpha: 0 } }).png().toFile('icon-256.png');
              fs.writeFileSync('public/icon.ico', await pngToIco('icon-256.png'));
            }
            console.log('Icons ready');
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF
          node prepare-icons.js

      # "--win nsis" builds ONLY the installer (no separate portable .exe).
      - name: Build Windows installer
        working-directory: frontend
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-build
          path: frontend/dist/*.exe
          retention-days: 30

